services:
  avalon:
    build:
      context: .
    image: avalon:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      CHAT_DB_PATH: ${CHAT_DB_PATH:-/data/avalon-chats.sqlite3}
      CHAT_DB_MAX_BYTES: ${CHAT_DB_MAX_BYTES:-2684354560}
      SELFIE_ARCHIVE_DIR: ${SELFIE_ARCHIVE_DIR:-/data/private/selfies}
    ports:
      - "127.0.0.1:5001:5001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - avalon_chat_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  avalon_chat_data:
